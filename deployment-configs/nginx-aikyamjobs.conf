# NGINX Configuration for aikyamjobs.org (the live production site)
# Live file: /etc/nginx/sites-available/aikyamjobs.org
#
# This replaces the old deployment-configs/nginx-beta.conf, which described a
# "beta.aikyamjobs.org" site that no longer exists -- it was renamed/consolidated
# to serve the bare aikyamjobs.org domain directly on 2026-06-10. This copy was
# confirmed against the real live file on 2026-10-22; keep it in sync if the
# live file changes (there is no automated sync -- copy changes both ways by
# hand, same as before).
#
# The app itself still runs from /var/www/beta-aikyamjobs on the VPS (ports
# 1338/3001, PM2 processes aikyamjobs-beta-backend/aikyamjobs-beta-frontend)
# -- only this nginx site's name/server_name changed, not the app deployment.
# See the "ACTUAL CURRENT STATE" note at the top of DEPLOYMENT.md.

# Keepalive + WebSocket: send "upgrade" only for real WebSocket handshakes;
# otherwise send an EMPTY Connection header so nginx actually reuses the
# upstream keepalive pools below. The common "'' close;" variant would instead
# kill upstream keepalive. Added 2026-10-27. (http context — must sit beside the
# upstream blocks, not inside a server/location block.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Upstream definitions
upstream main_aikyamjobs_backend {
    server 127.0.0.1:1338;
    keepalive 64;
}

upstream main_aikyamjobs_frontend {
    # max_fails=0: single upstream, so never mark it "down" on a transient
    # connection reset — otherwise one reset 503s EVERY request for fail_timeout
    # (default 10s), turning a blip into a 503 storm. With 0, a reset fails only
    # that one request (Next prefetch silently retries) instead of a whole
    # window. Added 2026-10-27 to tame the RSC-prefetch 503 bursts.
    server [::1]:3001 max_fails=0;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name aikyamjobs.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name aikyamjobs.org;
    # NOTE: this root doesn't actually exist (the app lives in
    # /var/www/beta-aikyamjobs, not /var/www/main-aikyamjobs) -- harmless
    # today since every path below is explicitly proxied, but would matter if
    # a root-served static fallback were ever needed.
    root /var/www/main-aikyamjobs/system/nginx-root;

    ssl_certificate /etc/letsencrypt/live/aikyamjobs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikyamjobs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 100M;

    # Defense-in-depth: block dotfiles (.env, .git, etc.) if `root` or any
    # future location block ever points closer to the app directories than
    # today's nonexistent placeholder root above. Safe to enable
    # unconditionally -- nothing legitimate is served from a dotfile path.
    # Added 2026-10-22 as part of the security audit fixes.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Strapi routes ---
    location /api {
        # Mitigation for CVE-2026-27886 (Strapi <5.37.0 boolean-oracle data
        # leak via relational query filters on updatedBy/createdBy -- no v4
        # patch exists; we're on 4.26.1). The frontend never filters by these
        # fields (confirmed in aikyamjobs-frontend/lib/api.ts), so blocking
        # them here is safe. Added 2026-10-22.
        if ($args ~* "(filters|where)(%5[Bb]|\[)(updatedBy|createdBy)") {
            return 403;
        }

        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # TODO (security): /admin is reachable by anyone on the internet with
    # only Strapi's own login as a gate. It also runs @strapi/permissions,
    # which (before the 2026-10-22 fix pinning @casl/ability to ^6.7.5 via
    # an npm override) carried a CVSS 9.8 prototype-pollution CVE as a core
    # dependency loaded on every boot. Consider an IP allowlist or
    # auth_basic layer here once there's a fixed office/VPN IP or htpasswd
    # file -- not enabled yet since doing so blindly would lock the team out.
    location /admin {
        proxy_pass http://main_aikyamjobs_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /uploads {
        proxy_pass http://main_aikyamjobs_backend/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Strapi admin-panel-internal plugin routes -- these are NOT the public
    # content API (that's /api above); Strapi's admin SPA calls these
    # top-level paths directly for plugin operations. All require Strapi's
    # own admin session to do anything meaningful.
    location /content-manager {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content-type-builder {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /i18n {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /email {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users-permissions {
        proxy_pass http://main_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js frontend ---
    location / {
        proxy_pass http://main_aikyamjobs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
