# NGINX Configuration for beta.aikyamjobs.org
# File: /etc/nginx/sites-available/beta.aikyamjobs.org

# Upstream definitions
upstream beta_aikyamjobs_backend {
    server 127.0.0.1:1338;
    keepalive 64;
}

upstream beta_aikyamjobs_frontend {
    server [::1]:3001;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name beta.aikyamjobs.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name beta.aikyamjobs.org;
    root /var/www/beta-aikyamjobs/system/nginx-root;

    ssl_certificate /etc/letsencrypt/live/beta.aikyamjobs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.aikyamjobs.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 100M;

    # Defense-in-depth: block dotfiles (.env, .git, etc.) if `root` or any
    # future location block ever points closer to the app directories than
    # today's empty placeholder nginx-root. Safe to enable unconditionally —
    # nothing legitimate is served from a dotfile path.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Strapi i18n plugin
    location /i18n {
        proxy_pass http://beta_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Strapi API endpoints (strips /api prefix before passing to Strapi)
    location /api {
        # Mitigation for CVE-2026-27886: Strapi <5.37.0 (we're on 4.26.1, no v4
        # patch exists) has a boolean-oracle data leak via relational query
        # filters on updatedBy/createdBy (e.g. ?where[updatedBy][resetPasswordToken][$startsWith]=a),
        # letting an unauthenticated caller extract an admin password-reset
        # token character by character. The frontend never filters by these
        # fields (confirmed in lib/api.ts), so blocking them here is safe.
        if ($args ~* "(filters|where)(%5[Bb]|\[)(updatedBy|createdBy)") {
            return 403;
        }

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://beta_aikyamjobs_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Strapi admin panel
    # TODO (security): this panel is currently reachable by anyone on the
    # internet, with only Strapi's own login as a gate. Recommended: restrict
    # by IP if the team has a known static IP/VPN, e.g.:
    #   allow 203.0.113.0/24;  # replace with your real office/home IP(s)
    #   deny all;
    # or add HTTP basic auth as a second factor in front of Strapi's own login:
    #   auth_basic "Restricted";
    #   auth_basic_user_file /etc/nginx/.htpasswd-admin;  # create with `htpasswd -c`
    # Left commented out here since enabling either without first confirming
    # the team's real IP(s) or generating htpasswd credentials would lock
    # everyone out of /admin, including legitimate editors.
    location /admin {
        proxy_pass http://beta_aikyamjobs_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Strapi uploads
    location /uploads {
        proxy_pass http://beta_aikyamjobs_backend/uploads;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://beta_aikyamjobs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
